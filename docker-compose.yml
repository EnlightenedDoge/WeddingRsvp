# The app joins NPM's Docker network; no ports are published on the host.
# NPM proxy hosts:
#   <your public host> -> http://wedding-rsvp:8080   (public, e.g. example.com)
#   admin.<your host>  -> http://wedding-rsvp:8081   (attach an Access List!)
# The real hostnames live only in .env (App__PublicBaseUrl, App__AdminBaseUrl), never in the repo.
services:
  wedding-rsvp:
    build: .
    container_name: wedding-rsvp
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    networks:
      - npm

networks:
  npm:
    external: true
    name: ${NPM_NETWORK:-npm_default}
