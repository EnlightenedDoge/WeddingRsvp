# Publishes the two app ports on the host; point your reverse proxy (Nginx / Nginx Proxy Manager) at them:
#   <your public host> -> http://<this-host>:${PUBLIC_HOST_PORT:-8080}   (guests and couples' sign-in/portal: public)
#   admin.<your host>  -> http://<this-host>:${ADMIN_HOST_PORT:-8081}    (site admin only: keep OFF the internet, LAN/VPN)
# The real hostname lives only in .env (App__PublicBaseUrl), never in the repo.
# Proxy and Docker on the same host with a shared network instead of published ports: add docker-compose.npm.yml
# (docker compose -f docker-compose.yml -f docker-compose.npm.yml up -d --build).
services:
  wedding-rsvp:
    build: .
    container_name: wedding-rsvp
    restart: unless-stopped
    env_file: .env
    # Run as this user so the data folder is owned by it. Default: the image's built-in non-root user (1654); the data
    # folder must be writable by it (chown 1654:1654 ./data once). On TrueNAS set APP_UID to the app's uid, e.g. 568.
    user: "${APP_UID:-1654}:${APP_GID:-1654}"
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PUBLIC_HOST_PORT:-8080}:8080"
      - "${ADMIN_BIND_ADDRESS:-127.0.0.1}:${ADMIN_HOST_PORT:-8081}:8081"
    volumes:
      # An absolute path on TrueNAS (a dataset), e.g. DATA_DIR=/mnt/tank/apps/wedding-rsvp
      - ${DATA_DIR:-./data}:/data
